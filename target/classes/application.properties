# ==============================================================================
# CONFIGURAÇÃO DE BANCO DE DADOS: RECARGA FÁCIL (SPRING BOOT)
# ==============================================================================

# --- CONFIGURAÇÃO PADRÃO: MYSQL ---
# Se o MySQL estiver rodando no seu computador:
spring.datasource.url=jdbc:mysql://localhost:3306/recargafacil?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Porta do Servidor Web REST
server.port=8080